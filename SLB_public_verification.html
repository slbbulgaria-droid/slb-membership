<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка на членство — СЛБ</title>
<style>
:root {
  --green:#145c3a;
  --green2:#0d432a;
  --gold:#b8954b;
  --cream:#f7f4ec;
  --text:#173b2a;
  --muted:#68756e;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:20px; font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(145deg,#edf3ee,#f8f6ef); color:var(--text);
}
.card {
  width:min(520px,100%); background:#fff; border-radius:24px; overflow:hidden;
  box-shadow:0 18px 55px rgba(15,55,35,.14);
}
.header {
  background:var(--green); color:#fff; text-align:center; padding:28px 24px 24px;
  border-bottom:5px solid var(--gold);
}
.logo {
  width:86px;height:86px;object-fit:cover;border-radius:50%;background:#fff;
  padding:5px; margin-bottom:14px;
}
.header h1 { margin:0; font-size:22px; line-height:1.25; letter-spacing:.3px; }
.header p { margin:9px 0 0; font-size:12px; letter-spacing:1.2px; opacity:.92; }
.body { padding:28px 26px 30px; }
.badge {
  display:block; width:max-content; max-width:100%; margin:0 auto 26px;
  padding:12px 20px; border-radius:999px; background:#e4f3e9; color:var(--green);
  font-weight:700; font-size:19px; text-align:center;
}
.row { padding:16px 0; border-top:1px solid #e7ebe8; }
.label { color:var(--muted); font-size:13px; margin-bottom:5px; }
.value { font-size:20px; font-weight:700; word-break:break-word; }
.footer {
  background:var(--cream); padding:17px 22px; text-align:center;
  color:var(--muted); font-size:12px;
}
#loading,#error { text-align:center; padding:20px 0; }
#error { color:#a32620; }
.small { margin-top:10px; font-size:12px; color:var(--muted); }
</style>
</head>

  <section class="body">
    <div id="loading">Проверка на членството…</div>
    <div id="result" hidden>
      <div class="badge">✓ ЧЛЕНСТВОТО Е ВАЛИДНО</div>
      <div class="row"><div class="label">Членски номер</div><div class="value" id="membership"></div></div>
      <div class="row"><div class="label">Регионална структура</div><div class="value" id="region"></div></div>
      <div class="row"><div class="label">Статус</div><div class="value" id="status"></div></div>

</main>

<script>
const FUNCTION_URL = "https://enobjgxrtktnhnacugep.supabase.co/functions/v1/verify-membership";

function showError(message) {
  document.getElementById("loading").hidden = true;
  document.getElementById("result").hidden = true;
  document.getElementById("error").hidden = false;
  document.getElementById("errorText").textContent = message || "";
}

async function verify() {
  const params = new URLSearchParams(location.search);
  const number = (params.get("membership_number") || "").trim();

  if (!number) {
    showError("Липсва членски номер за проверка.");
    return;
  }

  try {
    const response = await fetch(FUNCTION_URL + "?membership_number=" + encodeURIComponent(number));
    const data = await response.json();

    if (!response.ok || !data.valid) {
      showError(data.error || "Членството не е намерено.");
      return;
    }

    document.getElementById("loading").hidden = true;
    document.getElementById("membership").textContent = data.membership_number;
    document.getElementById("region").textContent = data.regional_structure;
    document.getElementById("status").textContent = data.status;
    document.getElementById("result").hidden = false;
  } catch (e) {
    showError("Неуспешна връзка със системата за проверка.");
  }
}

verify();
</script>
